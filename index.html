<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel city test</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #FBFAF7; color: #1F1F24; font: 18px/28px "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #hero { position: relative; overflow: hidden; background: #A69BD9; height: clamp(280px, 40vw, 600px); }
  #hero img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; image-rendering: pixelated; }
  .stripes { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  .stripes span { height: 4px; }
  main { max-width: 720px; padding: 32px 16px 80px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
  input[type=range] { width: 100%; height: 32px; accent-color: #3F4FD8; }
  .meta { color: #5C5C66; font-size: 16px; line-height: 24px; }
  .check { flex-direction: row; align-items: center; gap: 8px; min-height: 48px; }
</style>
</head>
<body>
<div id="hero"></div>
<div class="stripes" aria-hidden="true"><span style="background:#F2A7B5"></span><span style="background:#F8CFA6"></span><span style="background:#A8DCCB"></span></div>
<main>
  <p class="meta" id="status">Starting…</p>
  <label>City size <input id="size" type="range" min="0" max="100" value="50"></label>
  <label>Night <input id="night" type="range" min="0" max="100" value="0"></label>
  <label class="check"><input id="pulse" type="checkbox"> Simulate audio energy (120 BPM)</label>
  <p class="meta">Move or tap on the water for ripples. Add <code>?webgl</code> to the URL to force the WebGL2 fallback.</p>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
